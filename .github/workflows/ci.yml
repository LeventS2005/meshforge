# CI — the ungated test suite on every push/PR.
#
# Tests that need an external program (TotalSegmentator, CalculiX, OpenFOAM)
# skip cleanly when it is absent. What runs here is everything else: the
# geometry and meshing core, the readers and parsers, the web API, the page's
# asset guards, the copilot's tools, guard and report, and the CLI.
#
# The copilot extra (the Anthropic SDK) is NOT installed: no test calls the
# API, and the copilot's tests stand a fake client in.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # VTK/pyvista need a (virtual) display + GL on Linux; this installs
      # xvfb + mesa and exports DISPLAY for the whole job.
      - uses: pyvista/setup-headless-display-action@v3

      # The gmsh wheel links system GLU/X11 libs the runner image lacks.
      - name: Install gmsh system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1

      - name: Install meshforge + extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[meshing,image,web,viewport,dev]

      - name: Run test suite
        run: python -m pytest -q -rs
