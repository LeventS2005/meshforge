[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "meshforge"
version = "2.0.0"
description = "Demo edition: an AI copilot takes a CT of an aortic aneurysm from scan to wall stress and blood flow. Research software, not a medical device."
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Levent Sirtas" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
# Known-good bands: lower bound = the API the code needs, upper
# bound = the next major, EXCEPT the fragile numpy<->vtk pair which gets
# tight minor caps: NumPy 2.5 deprecated assigning to ndarray.shape and
# vtk<=9.6's numpy_support still does it on every conversion — the NumPy
# release that removes the setter hard-breaks VTK. Re-widen only after VTK
# ships a fixed numpy_support (see [tool.pytest.ini_options] filterwarnings).
# The conda env (environment.yml) stays the primary reproducible path.
dependencies = [
    "pyvista>=0.47,<1",  # 0.47 adds extract_surface(algorithm=...) — web/viewport.py passes it
    "vtk>=9.3,<9.7",
    "meshio>=5,<6",
    "numpy>=1.26,<2.6",
    "scipy>=1.11,<2",
    "scikit-image>=0.22,<1",
    "networkx>=3,<4",
]

[project.optional-dependencies]
# gmsh fills the thrombus and the blood lumen with tetrahedra.
meshing = [
    "gmsh>=4.11,<5",
]
# CT readers (NIfTI, DICOM). Lazy-imported: without this extra a .nii/.dcm
# input degrades to a loud install hint.
image = [
    "pydicom>=3,<4",
    "nibabel>=5,<6",
]
# The Claude copilot (`meshforge copilot`). Lazy-imported: nothing else needs
# it; without it the copilot says how to install it.
copilot = [
    "anthropic>=1.15,<2",
]
# The local web app (the Workbench). Pure-Python/wheel deps, so pip is fine.
# Lazy-imported so the CLI does not pay for them. httpx is what FastAPI's test
# client needs.
web = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "httpx>=0.27,<1",
]
# The interactive 3-D viewport. trame-vtk bundles the vtk.js assets the page
# loads. On macOS install it from conda-forge, NOT pip:
#   conda install -n meshforge -c conda-forge trame-vtk trame-vuetify
# Lazy-imported: the web JSON layer runs without it and the viewport then
# degrades to an "install this extra" note.
viewport = [
    "trame-vtk>=2.8,<3",
    "trame-vuetify>=3,<4",
]
dev = [
    "pytest>=8,<10",
]

[project.urls]
Homepage = "https://github.com/LeventS2005/meshforge"
Repository = "https://github.com/LeventS2005/meshforge"
Issues = "https://github.com/LeventS2005/meshforge/issues"

[project.scripts]
meshforge = "meshforge.cli:main"
meshforge-web = "meshforge.web.server:main"

[tool.setuptools.packages.find]
where = ["src"]

# Ship the static Workbench (index.html/app.js/viewport.js/styles.css) as package
# data — otherwise a real (non-editable) install has an empty web/static/ and the
# Workbench serves a blank page. Editable installs read it from src/.
[tool.setuptools.package-data]
"meshforge.web" = ["static/*"]
# Tissue strength library v0 (CC BY 4.0 derived data + its attribution file).
"meshforge.data" = ["*.csv", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # vtk<=9.6 numpy_support assigns ndarray.shape on every vtk<->numpy
    # conversion (deprecated in NumPy 2.5) — ~72k copies per run drowned
    # every real warning. Narrow: only this message, only from that module;
    # our own code still warns. Drop when VTK ships a fixed numpy_support
    # (the numpy<2.6 pin guards the eventual removal until then).
    'ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:vtkmodules\.util\.numpy_support',
]
